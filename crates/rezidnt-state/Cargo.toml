[package]
name = "rezidnt-state"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "rezidnt pure reducers, materialized graph, snapshots (doc §6)"

[dependencies]
rezidnt-types.workspace = true
serde.workspace = true
# serde_json: DR-017 `DelegationRecord.added_caveats: Vec<serde_json::Value>`
# folds the tagged Caveat JSON VERBATIM (I3). Already a workspace member and
# a transitive dep via rezidnt-types' `payload: serde_json::Value` — promoted
# from dev-dep to a real dep here (no new crate; ZERO new dependency, I7).
serde_json.workspace = true
ulid.workspace = true

[dev-dependencies]
proptest.workspace = true
time.workspace = true
# rezidnt-fabric + tempfile (DR-042 rebuild-equivalence oracle only): the I3
# owed test persists the orchestration fan-out to a REAL SQLite `EventLog` and
# reads it back exactly as `rezidnt rebuild` does (`EventLog::open` →
# `read_from(1)` → fold), proving the graph survives a persist→rebuild
# round-trip, not just an in-memory Materializer replay. Test-only; no runtime
# dependency added (I7). `rezidnt-fabric` is already a workspace member.
rezidnt-fabric.workspace = true
tempfile.workspace = true
